name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Root tooling
        run: npm ci
      - name: Backend lint and tests
        working-directory: backend
        run: |
          npm ci
          npm run lint
          JWT_SECRET=ci-fixture-only-secret npm test
      - name: Release 1 contract smoke (fixture)
        env:
          JWT_SECRET: ci-fixture-only-secret
        run: npm run contract:smoke
      - name: Data onboarding dry-run tests
        run: node --test scripts/data-onboarding/onboarding.test.mjs

  backend-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: attendance_v2
          MARIADB_USER: attendance
          MARIADB_PASSWORD: attendance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      JWT_SECRET: ci-mariadb-only-secret
      RUN_MARIADB_TESTS: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: attendance_v2
      DB_USER: attendance
      DB_PASSWORD: attendance
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: attendance
      MYSQL_PASSWORD: attendance
      MYSQL_DATABASE: attendance_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install migration tooling
        run: npm ci
      - name: Apply migrations and dev seed
        run: npm run db:migrate:seed
      - name: Backend lint and MariaDB integration tests
        working-directory: backend
        run: |
          npm ci
          npm run lint
          node --test --test-force-exit tests/*.test.js
      - name: Release 1 contract smoke (MariaDB)
        env:
          JWT_SECRET: ci-mariadb-only-secret
          DATA_SOURCE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: attendance_v2
          DB_USER: attendance
          DB_PASSWORD: attendance
        run: npm run contract:smoke

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start staging stack
        env:
          JWT_SECRET: ci-compose-smoke-secret
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full-stack Release 1 smoke
        env:
          COMPOSE_FRONTEND_URL: http://127.0.0.1:8080
          COMPOSE_BACKEND_URL: http://127.0.0.1:3210
        run: node scripts/compose-smoke.mjs
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/secret-scan.mjs

  agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  pages-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - env:
          VITE_BASE_PATH: /RAE-Attendance-System-V2/
          VITE_REVIEW_MODE: fixture
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend/Dockerfile
          push: false
          tags: rae-attendance-v2-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend/Dockerfile
          push: false
          tags: rae-attendance-v2-frontend:ci
