# The prod-dark compose file already contains this mount. Use this fragment only
# for a compose file that does not. Keep the prod-dark copy when the image tag changes.
services:
  backend:
    environment:
      ATTENDANCE_BACKUP_DIR: /var/lib/attendance-backups
    volumes:
      - ${ATTENDANCE_BACKUP_HOST_DIR:?Set a private persistent backup directory}:/var/lib/attendance-backups
