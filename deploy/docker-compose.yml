# Staging stack — NOT production. MariaDB + migrate + API + SPA.
#
# Persistent staging (default):    npm run staging:up
#   Applies migrations only. Never wipes data. Safe to restart.
# Disposable fixture stack:        npm run staging:fixture:up
#   Adds synthetic fixture data via the opt-in `seed` service.
# Tear down:                       npm run staging:down   (destroys the volume)
#
# `seed` is not part of the default stack: a routine `up` cannot erase staging data.

services:
  mariadb:
    image: mariadb:11.4
    container_name: rae-v2-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-attendance_v2}
      MARIADB_USER: ${MARIADB_USER:-attendance}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-attendance}
    ports:
      # Loopback by default: never publish the database on all interfaces.
      - '${COMPOSE_MARIADB_BIND:-127.0.0.1}:${COMPOSE_MARIADB_PORT:-3307}:3306'
    volumes:
      - rae_v2_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: node:20-alpine
    container_name: rae-v2-migrate
    working_dir: /workspace
    volumes:
      - ..:/workspace
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: '3306'
      MYSQL_USER: ${MARIADB_USER:-attendance}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-attendance}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-attendance_v2}
    # Schema only. Never the destructive fixture seed.
    command: sh -c "npm ci && npm run db:migrate"
    restart: 'no'

  # Disposable fixture data only. Fails closed by default:
  #   DEPLOY_ENV defaults to staging, which the seed guard always refuses, and
  #   ALLOW_FIXTURE_SEED defaults to false. Both must be set deliberately, and
  #   a persistent staging .env (DEPLOY_ENV=staging) can never seed even then.
  # The only supported path is `npm run staging:fixture:up`, which passes
  # ALLOW_FIXTURE_SEED=true and relies on DEPLOY_ENV=fixture from .env.
  seed:
    image: node:20-alpine
    profiles: ['fixture-seed']
    working_dir: /workspace
    volumes:
      - ..:/workspace
    depends_on:
      mariadb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: '3306'
      MYSQL_USER: ${MARIADB_USER:-attendance}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-attendance}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-attendance_v2}
      # Never hardcode the guard's own acknowledgement flags here.
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
      ALLOW_FIXTURE_SEED: ${ALLOW_FIXTURE_SEED:-false}
    command: sh -c "npm ci && npm run db:seed"
    restart: 'no'

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: rae-v2-backend
    # Bounded: a configuration error stops after three attempts with the reason
    # in the logs, instead of flapping forever under `unless-stopped`.
    restart: on-failure:3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3210'
      HOST: 0.0.0.0
      DATA_SOURCE: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_NAME: ${MARIADB_DATABASE:-attendance_v2}
      DB_USER: ${MARIADB_USER:-attendance}
      DB_PASSWORD: ${MARIADB_PASSWORD:-attendance}
      # No placeholder fallback. An unset or empty value is rejected by the
      # startup validator with a readable CONFIG_INVALID/JWT_SECRET_MISSING error,
      # and restart: on-failure:3 below stops the loop instead of flapping.
      # Generate one, e.g.: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8080}
      SSO_ENABLED: 'false'
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
    ports:
      - '${COMPOSE_BACKEND_PORT:-3210}:3210'
    healthcheck:
      # Readiness, not liveness: fails when configuration or the database is unusable.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3210/api/v1/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend/Dockerfile
    container_name: rae-v2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${COMPOSE_FRONTEND_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rae_v2_mariadb_data:
