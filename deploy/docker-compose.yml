# Disposable local / staging stack — not production. MariaDB + migrate + API + SPA.
# From repo root: npm run staging:up   (or docker compose -f deploy/docker-compose.yml up -d --build --wait)

services:
  mariadb:
    image: mariadb:11.4
    container_name: rae-v2-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-attendance_v2}
      MARIADB_USER: ${MARIADB_USER:-attendance}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-attendance}
    ports:
      - '${COMPOSE_MARIADB_PORT:-3307}:3306'
    volumes:
      - rae_v2_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: node:20-alpine
    container_name: rae-v2-migrate
    working_dir: /workspace
    volumes:
      - ..:/workspace
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: '3306'
      MYSQL_USER: ${MARIADB_USER:-attendance}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-attendance}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-attendance_v2}
    command: sh -c "npm ci && npm run db:migrate:seed"
    restart: 'no'

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: rae-v2-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3210'
      HOST: 0.0.0.0
      DATA_SOURCE: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_NAME: ${MARIADB_DATABASE:-attendance_v2}
      DB_USER: ${MARIADB_USER:-attendance}
      DB_PASSWORD: ${MARIADB_PASSWORD:-attendance}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8080}
      SSO_ENABLED: 'false'
    ports:
      - '${COMPOSE_BACKEND_PORT:-3210}:3210'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3210/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend/Dockerfile
    container_name: rae-v2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${COMPOSE_FRONTEND_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rae_v2_mariadb_data:
